name: Deploy ke Hostinger

# Berjalan otomatis setiap ada perubahan di branch main (misalnya setelah PR di-merge),
# atau manual dari tab Actions → "Deploy ke Hostinger" → Run workflow.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_PORT: ${{ secrets.SSH_PORT }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SITE_URL: ${{ vars.SITE_URL || 'https://klinikpondokmedika.id' }}
    steps:
      - uses: actions/checkout@v4

      - name: Cek secrets
        run: |
          for v in SSH_HOST SSH_PORT SSH_USER; do
            [ -n "${!v}" ] || { echo "::error::Secret $v belum diisi (Settings → Secrets and variables → Actions)"; exit 1; }
          done

      - name: Siapkan kunci SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          [ -n "$SSH_PRIVATE_KEY" ] || { echo "::error::Secret SSH_PRIVATE_KEY belum diisi"; exit 1; }
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          if [ -n "$SSH_KNOWN_HOSTS" ]; then
            printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            ssh-keyscan -p "$SSH_PORT" "$SSH_HOST" > ~/.ssh/known_hosts 2>/dev/null
          fi
          cat > ~/.ssh/config <<CFG
          Host hostinger
            HostName $SSH_HOST
            Port $SSH_PORT
            User $SSH_USER
            IdentityFile ~/.ssh/deploy_key
            ServerAliveInterval 15
          CFG
          ssh hostinger 'echo "Terhubung ke $(hostname)"'

      - name: Update backend (kode, dependensi, migrasi database)
        run: ssh hostinger 'cd ~/klinik-pondokmedika && git fetch --quiet origin main && git reset --quiet --hard origin/main && bash scripts/server-update-backend.sh'

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || 'https://klinikpondokmedika.id/api' }}
        run: |
          npm ci --no-audit --no-fund
          npm run build
          tar -czf ../frontend-release.tar.gz -C dist .

      - name: Pasang frontend
        run: |
          scp -q frontend-release.tar.gz hostinger:frontend-release.tar.gz
          ssh hostinger 'bash ~/klinik-pondokmedika/scripts/server-publish-frontend.sh ~/frontend-release.tar.gz'

      - name: Cek website
        run: |
          curl -fsS -o /dev/null -w "Beranda: %{http_code}\n" "$SITE_URL/"
          curl -fsS -o /dev/null -w "Backend: %{http_code}\n" "$SITE_URL/api/up"
          curl -fsS -o /dev/null -w "Layanan API: %{http_code}\n" "$SITE_URL/api/api/services"
          curl -fsS -o /dev/null -w "Sitemap: %{http_code}\n" "$SITE_URL/sitemap.xml"
